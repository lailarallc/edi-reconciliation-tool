<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}EDI Reconciliation{% endblock %} — Lailara LLC</title>
  <meta name="description" content="Content-level reconciliation across the full purchase-order lifecycle. Every mismatch surfaced and dollar-ranked.">
  <meta property="og:title" content="EDI Reconciliation">
  <meta property="og:description" content="Content-level reconciliation across the full purchase-order lifecycle. Every mismatch surfaced and dollar-ranked.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://reconcile.lailarallc.com/">
  <meta property="og:image" content="https://lailarallc.com/og/s/reconcile.png">
  <meta property="og:image:secure_url" content="https://lailarallc.com/og/s/reconcile.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="EDI Reconciliation">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://lailarallc.com/og/s/reconcile.png">
  <link rel="stylesheet" href="/static/css/lailara.css">
  <script src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js"
          integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2XoQrxeTUQyRjrOnlCoYta87iKBWq3EsdM2"
          crossorigin="anonymous"></script>
</head>
<body>
  <div class="page-wrapper">

    <nav class="site-nav">
      <span class="site-nav__brand">Lailara<span>.</span></span>
      <ul class="site-nav__links">
        <li><a href="/" class="{{ 'active' if active_page == 'dashboard' else '' }}">Exceptions</a></li>
        <li><a href="/lifecycle" class="{{ 'active' if active_page == 'lifecycle' else '' }}">PO Lifecycle</a></li>
        <li><a href="/catalog" class="{{ 'active' if active_page == 'catalog' else '' }}">Failure Patterns</a></li>
      </ul>
    </nav>

    {% block content %}{% endblock %}

    <footer class="site-footer">
      Built by <a href="https://lailarallc.com" target="_blank">Lailara LLC</a> —
      data hygiene and analytics consulting for specialty food brands scaling into national retail.
    </footer>

  </div>
  <script>
    // htmx does not swap error responses, so a failed partial would leave the
    // previous filter's rows (with their dollar figures) or a "Loading" note
    // in place. Replace the target with an explicit unavailable message.
    document.body.addEventListener("htmx:responseError", function (evt) {
      var target = evt.detail.target;
      if (!target) return;
      var msg = "Data temporarily unavailable. These figures could not be loaded; reload in a minute.";
      if (target.tagName === "TBODY") {
        target.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:32px;color:var(--text-secondary);font-size:14px;">' + msg + "</td></tr>";
      } else {
        target.innerHTML = '<p style="font-size:14px;color:var(--text-secondary);">' + msg + "</p>";
      }
    });
  </script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
